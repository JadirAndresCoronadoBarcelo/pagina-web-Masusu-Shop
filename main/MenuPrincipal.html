<!DOCTYPE html>

                    <p>XXX.XXX.XXX,XX</p>

        <footer>

                No se trata simplemete de los compenetes, tambien la comodidad influye en la experiencia. 
            </h6>

            <section id="contactos">

                <div class="redes">

                    <p>+57 3XX XXX XXXX</p>

                </div>

                <div class="redes">

                    <p>facebook page</p>
                </div>

                <div class="redes">

                    <p>correo@dominio.com</p>
